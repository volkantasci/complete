# Every hook is local and runs a tool that is already installed, so the hooks need no
# network: sandboxed sessions cannot download hook repositories. ruff is the version
# that requirements-dev.txt pins, run from the repository's .venv.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true
      - id: check-headers
        name: SPDX headers
        entry: python -m tools.check_headers
        language: system
        pass_filenames: false
        always_run: true
      - id: check-manifests
        name: addon manifests
        entry: python -m tools.check_manifests
        language: system
        pass_filenames: false
        always_run: true
      # Records are written at the provenance step, after verification, so local
      # commits only list missing ones; CI runs the strict check.
      - id: check-provenance
        name: provenance records
        entry: python -m tools.check_provenance --allow-missing
        verbose: true
        language: system
        pass_filenames: false
        always_run: true
      - id: check-docs-links
        name: documentation links
        entry: python -m tools.check_docs_links
        language: system
        pass_filenames: false
        always_run: true
