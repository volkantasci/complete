[project]
name = "complete"
version = "0.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docker"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Odoo module layout: __init__ files only import submodules; manifests are bare dict literals.
"**/__init__.py" = ["F401"]
"**/__manifest__.py" = ["B018"]
